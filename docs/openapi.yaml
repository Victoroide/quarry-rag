openapi: 3.1.0
info:
  title: Quarry HTTP API
  version: unversioned
  description: 'See the [API reference](api.md) for behavior and limits and the [authentication section](api.md#authentication) for the active credential requirements.'
externalDocs:
  description: API Reference
  url: api.md
paths:
  /health:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getHealth
      summary: Inspect backing stores
      description: 'See [GET /health](api.md#get-health).'
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Health'
        '500':
          $ref: '#/components/responses/Error'
  /livez:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getLiveness
      summary: Check process availability
      description: 'See [GET /livez](api.md#get-livez).'
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Probe'
        '500':
          $ref: '#/components/responses/Error'
  /readyz:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getReadiness
      summary: Check readiness
      description: 'See [GET /readyz](api.md#get-readyz).'
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Probe'
        '503':
          $ref: '#/components/responses/Probe'
        '500':
          $ref: '#/components/responses/Error'
  /ingest:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    post:
      operationId: ingestDocument
      summary: Accept a document
      description: 'See [document identity](api.md#document-identity), [owned ingestion in grants mode](grant-catalog.md#owned-ingestion), [queue admission and retries](api.md#queue-admission-and-retries), and optional [image-only](api.md#image-only-pdf-ocr), [mixed](api.md#mixed-pdf-ocr), or [layout](api.md#pdf-layout-analysis) PDF processing.'
      security:
        - ServiceToken: []
        - ServiceToken: []
          SubjectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MultipartIngestRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ingest'
        '202':
          $ref: '#/components/responses/Ingest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/IngestError'
        '422':
          $ref: '#/components/responses/ExtractionError'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/IngestError'
  /query:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    post:
      operationId: queryDocuments
      summary: Return selected evidence or a generated answer
      description: 'See [POST /query](api.md#post-query) for query scope, evidence checks including historical untagged hits, and partial hosted results.'
      security:
        - ServiceToken: []
        - ServiceToken: []
          SubjectToken: []
      parameters:
        - name: Accept-Language
          in: header
          description: 'Language of the no-evidence answer; see [POST /query](api.md#post-query).'
          schema:
            type: string
        - name: X-Quarry-Evaluation-Fixture
          in: header
          description: 'Fixture namespace for the [staging evaluation diagnostic](development.md#evidence-evaluation).'
          schema:
            type: string
            format: uuid
        - name: X-Quarry-Evaluation-Receipt
          in: header
          description: Receipt for checking active fixture ownership when observing a nonempty allowlist
          schema:
            type: string
            format: uuid
        - name: X-Quarry-Evaluation-Observe
          in: header
          description: 'Set to `off` to skip the [excerpt observation](development.md#evidence-evaluation).'
          schema:
            type: string
            enum: ['off']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query result, or server-sent events when the request accepts `text/event-stream`
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Content-Language:
              description: 'Language of the no-evidence answer; see [POST /query](api.md#post-query).'
              schema:
                type: string
            Vary:
              description: 'Includes `Accept-Language` for a no-evidence answer.'
              schema:
                type: string
            Cache-Control:
              description: '`no-cache` on streamed answers; see [streamed query answers](api.md#streamed-query-answers).'
              schema:
                type: string
            X-Accel-Buffering:
              description: '`no` on streamed answers; see [streamed query answers](api.md#streamed-query-answers).'
              schema:
                type: string
            X-Quarry-Evaluation-Evidence:
              description: 'Optional scoped excerpt matches for the [staging evaluation diagnostic](development.md#evidence-evaluation).'
              schema:
                type: string
            X-Quarry-Evaluation-Execution:
              description: 'Provider execution provenance for the [staging evaluation](development.md#evidence-evaluation).'
              schema:
                type: string
            X-Quarry-Evaluation-Upstreams:
              description: 'TLS-verified embedding and synthesis origins, in call-role order; see [staging evaluation](development.md#evidence-evaluation).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
            text/event-stream:
              schema:
                type: string
                description: 'Events `context` (QueryStreamContext), `delta` (QueryStreamDelta), `done` (QueryStreamDone) and `error` (APIError); see [streamed query answers](api.md#streamed-query-answers).'
        '400':
          description: 'Invalid query, including a null, malformed or disabled `document_set_id`, or embedding input rejected by the local profile. See [POST /query](api.md#post-query).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: 'Forbidden query, including a query from an inactive principal before set resolution.'
        '404':
          description: 'A well-formed `document_set_id` that is missing, foreign, deleted or expired. See [document sets](api.md#document-sets).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '502':
          description: 'Upstream synthesis or embedding model-window failure. See [POST /query](api.md#post-query).'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '503':
          $ref: '#/components/responses/RetryableError'
          description: 'Service unavailable, including when document sets are enabled and the vector store cannot confine a search to the set.'
        '504':
          $ref: '#/components/responses/Error'
          description: 'Query timeout. See the status conditions under [POST /query](api.md#post-query).'
  /documents:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: listDocuments
      summary: List document summaries or legacy references
      description: 'See [GET /documents](api.md#get-documents).'
      security:
        - ServiceToken: []
        - ServiceToken: []
          SubjectToken: []
      parameters:
        - name: limit
          in: query
          description: 'Page size; see [pagination](api.md#get-documents).'
          schema:
            type: integer
        - name: after
          in: query
          description: 'Exclusive cursor; see [pagination](api.md#get-documents).'
          schema:
            type: string
            format: uuid
        - name: collection
          in: query
          description: 'Collection filter; see [GET /documents](api.md#get-documents).'
          schema:
            type: string
        - $ref: '#/components/parameters/IncludeIncarnation'
        - $ref: '#/components/parameters/IncludeIndexVisibility'
        - $ref: '#/components/parameters/IncludePDFCoverage'
      responses:
        '200':
          description: >-
            Document inventory. After a grants-mode stream begins, a caller policy
            change or inactive principal can end it with partial JSON and no count.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInventoryResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: Access denied, including an inactive principal before a grants-mode response starts.
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
          description: Inventory unavailable, including four consecutive caller policy mismatches before the response starts.
  /documents/{doc_id}:
    parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: getDocument
      summary: Inspect document ingestion status
      description: 'See [GET /documents/{doc_id}](api.md#get-documentsdoc_id).'
      security:
        - ServiceToken: []
        - ServiceToken: []
          SubjectToken: []
      parameters:
        - $ref: '#/components/parameters/IncludeIncarnation'
        - $ref: '#/components/parameters/IncludeIndexVisibility'
        - $ref: '#/components/parameters/IncludePDFCoverage'
      responses:
        '200':
          description: Document summary released after a caller policy recheck in grants mode.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: Access denied, including an inactive principal in grants mode.
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
          description: Status unavailable, including four consecutive caller policy mismatches in grants mode.
    delete:
      operationId: deleteDocument
      summary: Remove a document and its stored artifacts
      description: 'See [DELETE /documents/{doc_id}](api.md#delete-documentsdoc_id).'
      security:
        - ServiceToken: []
        - ServiceToken: []
          SubjectToken: []
      parameters:
        - name: X-Document-Incarnation
          in: header
          description: 'The document lifetime the caller observed. Required for a live document once checkpointed deletion is active and reserved before then; see [DELETE /documents/{doc_id}](api.md#delete-documentsdoc_id).'
          schema:
            type: string
            format: uuid
        - name: release_held
          in: query
          description: 'Replay and release a matching held deletion on the offline service (`true`), or select ordinary deletion (`false` or omitted); see [DELETE /documents/{doc_id}](api.md#delete-documentsdoc_id).'
          schema:
            type: boolean
      responses:
        '200':
          description: Deletion result
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RetryableError'
  /evaluation/fixtures:
    parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/EvaluationNamespace'
      - $ref: '#/components/parameters/EvaluationReceipt'
    post:
      operationId: ingestEvaluationFixture
      summary: Accept an evaluation fixture with a durable receipt
      description: 'See the [fixture lifecycle](development.md#evidence-evaluation).'
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationFixtureIngestRequest'
      responses:
        '202':
          description: Fixture accepted
          headers:
            X-Quarry-Evaluation-State:
              $ref: '#/components/headers/EvaluationState'
            X-Document-Incarnation:
              $ref: '#/components/headers/EvaluationRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/IngestError'
  /evaluation/fixtures/{doc_id}:
    parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/DocumentID'
      - $ref: '#/components/parameters/EvaluationNamespace'
      - $ref: '#/components/parameters/EvaluationReceipt'
    get:
      operationId: getEvaluationFixture
      summary: Inspect a fixture receipt and its current document
      description: 'See the [fixture lifecycle](development.md#evidence-evaluation).'
      security:
        - ServiceToken: []
      responses:
        '200':
          description: Current fixture status
          headers:
            X-Quarry-Evaluation-State:
              $ref: '#/components/headers/EvaluationState'
            X-Document-Incarnation:
              $ref: '#/components/headers/EvaluationRevision'
            X-Quarry-Evaluation-Database-Time:
              description: 'PostgreSQL observation time for the [completion-event bounds](development.md#evidence-evaluation).'
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIncarnationSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          description: Fixture absent, retired before admission, or durably deleted
          headers:
            X-Quarry-Evaluation-State:
              $ref: '#/components/headers/EvaluationState'
            X-Document-Incarnation:
              $ref: '#/components/headers/EvaluationRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '409':
          description: The receipt does not own the fixture ID
          headers:
            X-Quarry-Evaluation-State:
              description: Receipt state is borrowed
              schema:
                type: string
                enum: [borrowed]
            X-Document-Incarnation:
              $ref: '#/components/headers/EvaluationRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '412':
          $ref: '#/components/responses/EvaluationFixturePrecondition'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteEvaluationFixture
      summary: Remove a receipt-qualified fixture revision
      description: 'See the [fixture lifecycle](development.md#evidence-evaluation).'
      security:
        - ServiceToken: []
      parameters:
        - name: X-Document-Incarnation
          in: header
          description: Required for revision-qualified deletion. Omit for absence reconciliation.
          schema:
            type: string
            format: uuid
        - name: X-Quarry-Evaluation-Reconcile
          in: header
          description: Retire absent admission intent without sweeping vectors.
          schema:
            type: string
            enum: [absent]
      responses:
        '200':
          description: Durable fixture deletion or absence retirement receipt
          headers:
            X-Quarry-Evaluation-State:
              $ref: '#/components/headers/EvaluationState'
            X-Document-Incarnation:
              $ref: '#/components/headers/EvaluationRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/EvaluationFixtureConflict'
        '412':
          $ref: '#/components/responses/EvaluationFixturePrecondition'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/RetryableError'
  /documents/{doc_id}/file:
    parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/DocumentID'
    get:
      operationId: getDocumentFile
      summary: Obtain an original-file download address
      description: 'See [GET /documents/{doc_id}/file](api.md#get-documentsdoc_idfile).'
      security:
        - ServiceToken: []
        - ServiceToken: []
          SubjectToken: []
      responses:
        '200':
          description: Original-file download
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /deletion-mode:
    parameters:
      - $ref: '#/components/parameters/RequestID'
    get:
      operationId: getDeletionMode
      summary: Read the deletion mode of the service database
      description: 'See [GET /deletion-mode](api.md#get-deletion-mode).'
      security:
        - ServiceToken: []
      responses:
        '200':
          description: Deletion mode recorded in the database
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionModeResponse'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ServiceToken:
      type: apiKey
      in: header
      name: X-Service-Token
    SubjectToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      description: 'Correlation value; see [Request IDs](api.md#request-ids).'
      schema:
        type: string
    DocumentID:
      name: doc_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncludeIncarnation:
      name: include_incarnation
      in: query
      description: 'Selects the [incarnation projection](api.md#get-documents).'
      schema:
        type: boolean
        default: false
    IncludeIndexVisibility:
      name: include_index_visibility
      in: query
      description: 'Selects the [index visibility observation](api.md#get-documents).'
      schema:
        type: boolean
        default: false
    IncludePDFCoverage:
      name: include_pdf_coverage
      in: query
      description: Send a single literal `true` to include recorded PDF coverage. May be combined with `include_incarnation`.
      schema:
        type: boolean
        default: false
    EvaluationNamespace:
      name: X-Quarry-Evaluation-Fixture
      in: header
      required: true
      schema:
        type: string
        format: uuid
    EvaluationReceipt:
      name: X-Quarry-Evaluation-Receipt
      in: header
      required: true
      schema:
        type: string
        format: uuid
  headers:
    EvaluationState:
      description: 'Receipt state for the [fixture lifecycle](development.md#evidence-evaluation).'
      schema:
        type: string
        enum: [missing, borrowed, owned, busy, deleted, retired, store_mismatch]
    EvaluationRevision:
      description: Optional incarnation when the receipt owns a current or deleted fixture revision
      schema:
        type: string
        format: uuid
    RequestID:
      description: 'Correlation value; see [Request IDs](api.md#request-ids).'
      schema:
        type: string
    RetryAfter:
      description: 'Retry delay in seconds; see the matching endpoint in [API Reference](api.md).'
      schema:
        type: integer
  responses:
    EvaluationFixtureConflict:
      description: A revision-qualified delete found a running job, or absence reconciliation found an owned or borrowed fixture
      headers:
        X-Quarry-Evaluation-State:
          $ref: '#/components/headers/EvaluationState'
        X-Document-Incarnation:
          $ref: '#/components/headers/EvaluationRevision'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    EvaluationFixturePrecondition:
      description: Fixture qualification failed, the deployment has no durable vector store, or the original vector store is unavailable
      headers:
        X-Quarry-Evaluation-State:
          $ref: '#/components/headers/EvaluationState'
        X-Document-Incarnation:
          $ref: '#/components/headers/EvaluationRevision'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    Health:
      description: Backing-store health
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthStatus'
    Probe:
      description: Probe status
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProbeStatus'
    Ingest:
      description: Ingestion acceptance result
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngestResponse'
    Error:
      description: 'Request failed; see the matching endpoint in [API Reference](api.md).'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    RetryableError:
      description: 'Request failed and can be retried; see the endpoint error table in the [API Reference](api.md).'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
    ExtractionError:
      description: 'Extraction failed; see [multipart ingestion](api.md#variant-b-multipart-form-upload).'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtractionError'
    IngestError:
      description: 'Request failed; see [POST /ingest](api.md#post-ingest).'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/APIError'
              - $ref: '#/components/schemas/ExtractionError'
  schemas:
    HealthStatus:
      type: object
      description: 'See [GET /health](api.md#get-health).'
      additionalProperties: false
      required: [status, pinecone, postgres, neon, s3]
      properties:
        status:
          type: string
        pinecone:
          type: string
        postgres:
          type: string
        neon:
          type: string
          deprecated: true
        s3:
          type: string
    ProbeStatus:
      type: object
      description: 'See [liveness](api.md#get-livez) and [readiness](api.md#get-readyz).'
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
    IngestRequest:
      type: object
      description: 'See [JSON ingestion](api.md#variant-a-json-request).'
      additionalProperties: false
      required: [content]
      properties:
        document_id:
          type: string
        content:
          type: string
        metadata:
          type: [object, 'null']
          additionalProperties: true
        doc_type:
          type: string
        collection:
          type: string
    EvaluationFixtureIngestRequest:
      allOf:
        - $ref: '#/components/schemas/IngestRequest'
        - required: [document_id, collection]
    MultipartIngestRequest:
      type: object
      description: 'See [multipart ingestion](api.md#variant-b-multipart-form-upload), [DOCX story selection](api.md#docx-story-selection) and [Word binary extraction](api.md#word-binary-extraction).'
      additionalProperties: true
      required: [file]
      properties:
        file:
          type: string
          format: binary
        document_id:
          type: string
        doc_type:
          type: string
        collection:
          type: string
        metadata:
          type: string
    IngestResponse:
      type: object
      description: 'See [POST /ingest](api.md#post-ingest).'
      additionalProperties: false
      required: [document_id, status]
      properties:
        document_id:
          type: string
          format: uuid
        status:
          type: string
    QueryRequest:
      type: object
      description: 'See [POST /query](api.md#post-query).'
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
        mode:
          type: string
          description: 'Automatic routing uses the deployment policy. See [retrieval modes](api.md#post-query).'
        answer_mode:
          type: string
          enum: [generated, evidence]
          description: 'Defaults to the deployed policy. See [evidence-only queries](api.md#evidence-only-queries).'
        filter_doc_type:
          type: string
        collection:
          type: string
        max_chunks:
          type: integer
        include_citations:
          type: boolean
        preserve_code:
          type: boolean
          description: 'Requires include_citations. See [POST /query](api.md#post-query).'
        allowed_document_ids:
          type: [array, 'null']
          items:
            type: string
            format: uuid
        document_set_id:
          type: string
          format: uuid
          description: 'Optional reference to a document set owned by the authenticated subject. Accepted only when `DOCUMENT_SETS_ENABLED` is true; see [document sets](api.md#document-sets).'
    QueryResponse:
      type: object
      description: 'See [POST /query](api.md#post-query).'
      additionalProperties: false
      required: [answer, mode, chunks_used, token_usage, scored_chunks]
      properties:
        finish_reason:
          type: string
          enum: [stop, max_tokens, filtered, context_exceeded, no_evidence, evidence_only]
        answer:
          type: string
        mode:
          type: string
        chunks_used:
          type: integer
        context_chunks:
          type: integer
        context_tokens:
          type: integer
        count_method:
          type: string
          enum: [bedrock_count_tokens, openai_o200k_chat, openai_cl100k_chat]
        model_input_tokens:
          type: integer
          minimum: 1
        early_exit:
          type: boolean
        stage_timings_ms:
          type: object
          additionalProperties:
            type: integer
            format: int64
        token_usage:
          $ref: '#/components/schemas/TokenUsage'
        scored_chunks:
          type: array
          items:
            $ref: '#/components/schemas/ScoredChunkResponse'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CitationResponse'
        citation_coverage:
          $ref: '#/components/schemas/CitationCoverage'
    ScoredChunkResponse:
      type: object
      description: 'See [scored chunks](api.md#post-query).'
      additionalProperties: false
      required: [doc_id, doc_type, chunk_index, score, text]
      properties:
        doc_id:
          type: string
          format: uuid
        doc_type:
          type: string
        chunk_index:
          type: integer
        score:
          type: number
          format: double
        rerank_score:
          type: number
          format: double
        text:
          type: string
        kind:
          type: string
        quality:
          type: string
        pages:
          type: array
          items:
            type: integer
        table_ids:
          type: array
          items:
            type: string
        row_ids:
          type: array
          items:
            type: string
        excerpt:
          type: integer
        truncated:
          type: boolean
    CitationResponse:
      type: object
      description: 'See [citations](api.md#post-query).'
      additionalProperties: false
      required: [excerpt, doc_id, chunk_index, offset, verified, overlap]
      properties:
        excerpt:
          type: integer
        doc_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
        offset:
          type: integer
        verified:
          type: boolean
        overlap:
          type: number
          format: double
        support:
          $ref: '#/components/schemas/CitationSupport'
    CitationSupport:
      type: object
      description: 'See [citation support](api.md#citation-support).'
      additionalProperties: false
      required: [status, method, version, evidence]
      properties:
        status:
          type: string
          enum: [supported, contradicted, insufficient, unchecked]
        method:
          type: string
        version:
          type: string
        evidence:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
    CitationCoverage:
      type: object
      description: 'See [citation support](api.md#citation-support).'
      additionalProperties: false
      required: [sentences, cited_sentences]
      properties:
        sentences:
          type: integer
          minimum: 0
        cited_sentences:
          type: integer
          minimum: 0
    QueryStreamContext:
      type: object
      description: 'See [streamed query answers](api.md#streamed-query-answers).'
      additionalProperties: false
      required: [mode, chunks_used, context_chunks, scored_chunks]
      properties:
        mode:
          type: string
        chunks_used:
          type: integer
        context_chunks:
          type: integer
        scored_chunks:
          type: array
          items:
            $ref: '#/components/schemas/ScoredChunkResponse'
    QueryStreamDelta:
      type: object
      description: 'See [streamed query answers](api.md#streamed-query-answers).'
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
    QueryStreamDone:
      type: object
      description: 'See [streamed query answers](api.md#streamed-query-answers).'
      additionalProperties: false
      required: [finish_reason, token_usage, context_tokens, stage_timings_ms]
      properties:
        finish_reason:
          type: string
          enum: ['', stop, max_tokens, filtered, context_exceeded, no_evidence, evidence_only]
        token_usage:
          $ref: '#/components/schemas/TokenUsage'
        context_tokens:
          type: integer
        count_method:
          type: string
          enum: [bedrock_count_tokens, openai_o200k_chat, openai_cl100k_chat]
        model_input_tokens:
          type: integer
          minimum: 1
        stage_timings_ms:
          type: object
          additionalProperties:
            type: integer
            format: int64
        early_exit:
          type: boolean
        citations:
          type: array
          items:
            $ref: '#/components/schemas/CitationResponse'
        citation_coverage:
          $ref: '#/components/schemas/CitationCoverage'
    TokenUsage:
      type: object
      description: 'See [POST /query](api.md#post-query).'
      additionalProperties: false
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          format: int32
        output_tokens:
          type: integer
          format: int32
        total_tokens:
          type: integer
          format: int32
    DocumentList:
      type: object
      description: 'See [GET /documents](api.md#get-documents).'
      additionalProperties: false
      required: [documents, count]
      properties:
        documents:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/DocumentSummary'
              - $ref: '#/components/schemas/DocumentRef'
        count: &documentListCount
          type: integer
        next_after: &documentListCursor
          type: [string, 'null']
          format: uuid
    DocumentIncarnationList:
      type: object
      additionalProperties: false
      required: [documents, count]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentIncarnationSummary'
        count: *documentListCount
        next_after: *documentListCursor
    DocumentInventoryResponse:
      anyOf:
        - $ref: '#/components/schemas/DocumentList'
        - $ref: '#/components/schemas/DocumentIncarnationList'
    DocumentStatusResponse:
      oneOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - $ref: '#/components/schemas/DocumentIncarnationSummary'
    DocumentSummary:
      type: object
      description: 'See [document summaries](api.md#get-documents).'
      additionalProperties: false
      required: [document_id, doc_type, collection, status, chunk_count, file_name, file_type, created_at, updated_at, completed_at]
      properties:
        document_id: &documentSummaryID
          type: string
          format: uuid
        doc_type: &documentSummaryDocType
          type: string
        collection: &documentSummaryCollection
          type: string
        s3_key: &documentSummaryS3Key
          type: string
        status: &documentSummaryStatus
          type: string
        chunk_count: &documentSummaryChunkCount
          type: integer
        file_name: &documentSummaryFileName
          type: [string, 'null']
        file_type: &documentSummaryFileType
          type: [string, 'null']
        created_at: &documentSummaryCreatedAt
          type: string
          format: date-time
        updated_at: &documentSummaryUpdatedAt
          type: string
          format: date-time
        completed_at: &documentSummaryCompletedAt
          type: [string, 'null']
          format: date-time
        index_visibility: &documentSummaryIndexVisibility
          type: string
          enum: [unknown, disabled, timeout, sample_seen, writes_indexed, transactional]
        index_visibility_observed_at: &documentSummaryIndexVisibilityObservedAt
          type: string
          format: date-time
        last_error: &documentSummaryLastError
          type: string
        pdf_coverage: &documentSummaryPDFCoverage
          type: string
          enum: [pending, complete, partial, failed]
          description: Included when requested and recorded for mixed PDF OCR or PDF layout analysis. `partial` covers unresolved pages in mixed OCR as well as rotated text, unlinked lines, unmatched layout tables, ambiguous table spans, missing/unrecognized pages, or provider warnings in layout analysis; per-page reasons are stored internally and not returned.
    DocumentIncarnationSummary:
      type: object
      additionalProperties: false
      required: [document_id, doc_type, collection, status, chunk_count, file_name, file_type, created_at, updated_at, completed_at, incarnation]
      properties:
        document_id: *documentSummaryID
        doc_type: *documentSummaryDocType
        collection: *documentSummaryCollection
        s3_key: *documentSummaryS3Key
        status: *documentSummaryStatus
        chunk_count: *documentSummaryChunkCount
        file_name: *documentSummaryFileName
        file_type: *documentSummaryFileType
        created_at: *documentSummaryCreatedAt
        updated_at: *documentSummaryUpdatedAt
        completed_at: *documentSummaryCompletedAt
        index_visibility: *documentSummaryIndexVisibility
        index_visibility_observed_at: *documentSummaryIndexVisibilityObservedAt
        last_error: *documentSummaryLastError
        pdf_coverage: *documentSummaryPDFCoverage
        incarnation:
          type: string
          format: uuid
    DocumentRef:
      type: object
      description: 'See [legacy document references](api.md#get-documents).'
      additionalProperties: false
      required: [document_id, doc_type]
      properties:
        document_id:
          type: string
          format: uuid
        doc_type:
          type: string
        s3_key:
          type: string
    FileResponse:
      type: object
      description: 'See [GET /documents/{doc_id}/file](api.md#get-documentsdoc_idfile).'
      additionalProperties: false
      required: [url, expires_in]
      properties:
        url:
          type: string
          format: uri
        expires_in:
          type: integer
          description: Requested lifetime in seconds (900), an upper bound on when a download can start.
    DeleteResponse:
      type: object
      description: 'See [DELETE /documents/{doc_id}](api.md#delete-documentsdoc_id).'
      additionalProperties: false
      required: [deleted, doc_id]
      properties:
        deleted:
          type: boolean
        doc_id:
          type: string
          format: uuid
    DeletionModeResponse:
      type: object
      description: 'See [GET /deletion-mode](api.md#get-deletion-mode).'
      additionalProperties: false
      required: [deletion_mode]
      properties:
        deletion_mode:
          type: string
          enum: [inactive, active]
    APIError:
      type: object
      description: 'See [error envelopes](api.md).'
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    ExtractionError:
      type: object
      description: 'See [extraction error codes](api.md#variant-b-multipart-form-upload).'
      additionalProperties: false
      required: [error, message, code]
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
