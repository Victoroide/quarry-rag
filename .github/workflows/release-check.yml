name: Release check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RELEASE_CHECK_TAG: v0.0.0-check

jobs:
  changes:
    name: Check for release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      preflight: ${{ steps.inputs.outputs.preflight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect release inputs
        id: inputs
        run: |
          preflight=$(.github/scripts/release-inputs.sh HEAD^1 HEAD)
          echo "preflight=$preflight" >> "$GITHUB_OUTPUT"

  archive-targets:
    name: Check archive targets (${{ matrix.group }})
    needs: changes
    if: ${{ needs.changes.outputs.preflight == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: first
            targets: linux/amd64 darwin/arm64 windows/amd64
          - group: second
            targets: linux/arm64 darwin/amd64 windows/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check release scripts
        if: ${{ matrix.group == 'first' }}
        run: bash .github/scripts/release-test.sh
      - name: Build and verify release archives
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a targets <<< "$TARGETS"
          .github/scripts/build-release.sh "$RELEASE_CHECK_TAG" dist "${targets[@]}"
          .github/scripts/check-release.sh archives "$RELEASE_CHECK_TAG" dist "${targets[@]}"
          mkdir inventory
          cp "dist/quarry-rag_${RELEASE_CHECK_TAG#v}_checksums.txt" inventory/
          if [[ $GROUP == first ]]; then
            .github/scripts/build-release.sh --list "$RELEASE_CHECK_TAG" | cut -f1 > inventory/expected.txt
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive-inventory-${{ matrix.group }}
          path: inventory/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  archives:
    name: Check release archives
    needs: [changes, archive-targets]
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.preflight != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require both archive groups
        env:
          PREFLIGHT: ${{ needs.changes.outputs.preflight }}
          TARGET_RESULTS: ${{ needs.archive-targets.result }}
        run: test "$PREFLIGHT" = true && test "$TARGET_RESULTS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-archive-inventory-*
          path: inventories
      - name: Verify the combined inventory
        shell: bash
        run: |
          manifest="quarry-rag_${RELEASE_CHECK_TAG#v}_checksums.txt"
          .github/scripts/check-release.sh inventory inventories/release-archive-inventory-first/expected.txt \
            "inventories/release-archive-inventory-first/$manifest" \
            "inventories/release-archive-inventory-second/$manifest"
