name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m --config=.golangci.yml ./... ./.github/scripts/testreport

  test:
    name: Test with race detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    services:
      postgres:
        image: postgres:16.13-alpine3.23@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rag -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      pgvector:
        image: pgvector/pgvector:0.8.7-pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rag -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go
        shell: bash
        run: |
          {
            echo "version=$(go env GOVERSION)"
            echo "modules=$(go env GOMODCACHE)"
            echo "image=${ImageOS}-${ImageVersion}"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$RUNNER_TEMP/go-build-race" >> "$GITHUB_ENV"
      - name: Restore Go modules
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.modules }}
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - name: Restore race build objects
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-cgo1-${{ hashFiles('go.mod', 'go.sum') }}-${{ steps.go.outputs.week }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-cgo1-${{ hashFiles('go.mod', 'go.sum') }}-
            go-race-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-cgo1-
      - name: Check database services
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGVECTOR_CONTAINER: ${{ job.services.pgvector.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U rag -d postgres -v ON_ERROR_STOP=1 -tAc 'SELECT version()'
          docker exec "$PGVECTOR_CONTAINER" psql -U rag -d postgres -v ON_ERROR_STOP=1 -tAc "SELECT name || ' ' || default_version FROM pg_available_extensions WHERE name = 'vector'" | grep -Fx 'vector 0.8.7'
          docker exec --user root "$PGVECTOR_CONTAINER" localedef --no-archive -i es_ES -f UTF-8 es_ES.utf8
      - name: Test the report tool
        run: |
          go test -race -count=1 ./.github/scripts/testreport
          go test -run '^$' -bench '^BenchmarkDiagnosticSpillPeakRSS$' -benchtime=1x ./.github/scripts/testreport
      - name: Build the report tool
        run: go build -o "$RUNNER_TEMP/testreport" ./.github/scripts/testreport
      - name: Run unit and integration tests
        shell: bash
        env:
          QUARRY_TEST_POSTGRES_ADMIN_DSN: postgres://rag:rag@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          QUARRY_TEST_PGVECTOR_ADMIN_DSN: postgres://rag:rag@127.0.0.1:${{ job.services.pgvector.ports['5432'] }}/postgres?sslmode=disable
          MODULE_CACHE: ${{ steps.modules.outputs.cache-hit == 'true' && 'exact hit' || steps.modules.outputs.cache-matched-key != '' && 'restored from an earlier key' || 'miss' }}
          BUILD_CACHE: ${{ steps.build.outputs.cache-hit == 'true' && 'exact hit' || steps.build.outputs.cache-matched-key != '' && 'restored from an earlier key' || 'miss' }}
        run: |
          mapfile -t packages < <(go list ./...)
          go test -race -count=1 -json ./... |
            "$RUNNER_TEMP/testreport" -diagnostic-spill -module-cache "$MODULE_CACHE" -build-cache "$BUILD_CACHE" "${packages[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Save Go modules
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go.outputs.modules }}
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Save race build objects
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ steps.build.outputs.cache-primary-key }}

  windows-ledger:
    name: Test Windows fixture ledger
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check fixture ledger creation, recovery and locking
        run: go test -short -count=1 -p 2 -run '^(TestCancellationBeforeIngestDispatchClearsIntent|TestFixtureLedgerLockSurvivesRenameAndReleasesOnExit)$' ./scripts/evidenceeval

  build:
    name: Build service and runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The CodeQL workflow compiles every package on these two events. Other
      # events compile them here.
      PACKAGES_ANALYZED: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.PACKAGES_ANALYZED != 'true'
        with:
          go-version-file: go.mod
      - name: Build packages
        if: env.PACKAGES_ANALYZED != 'true'
        run: go build ./...
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
      - name: Create runtime image output directory
        run: mkdir -p "$RUNNER_TEMP/runtime-image"
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/runtime-image/runtime-image.tar
          provenance: false
          cache-from: type=gha,scope=ci-runtime
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ci-runtime' || '' }}
      - name: Check runtime image
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          docker buildx build --builder "$BUILDER" --target verify-runtime \
            --build-context "runtime-output=$RUNNER_TEMP/runtime-image" \
            --output type=cacheonly --progress plain .

  govulncheck:
    name: Check reachable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan packages
        run: govulncheck ./...

  diagrams:
    name: Check vector diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/diagrams/go.mod
          cache-dependency-path: tools/diagrams/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l tools/diagrams)"
      - name: Vet diagram packages
        run: go -C tools/diagrams vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: tools/diagrams
          args: --timeout=5m --config=../../.golangci.yml
      - name: Install vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan diagram packages
        run: cd tools/diagrams && govulncheck -show verbose ./...
      - name: Validate vector diagrams
        run: make diagrams-check
