name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 1"
    - cron: "41 3 * * 0,2-6"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration per fuzz target
        required: false
        default: 2m
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  nightly:
    name: Fuzz smoke test
    if: github.event.schedule == '41 3 * * 0,2-6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz every target for five seconds
        run: make fuzz FUZZTIME=5s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-nightly
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 14

  inventory:
    name: Discover fuzz packages
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.inventory.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: List packages with fuzz targets
        id: inventory
        shell: bash
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
        run: |
          packages=$(go run ./scripts/fuzz -matrix -fuzztime="$FUZZTIME")
          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.package }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz the assigned targets
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
          FUZZ_INVENTORY: ${{ matrix.inventory }}
        run: sh .github/scripts/fuzz.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-package-${{ strategy.job-index }}
          path: '${{ matrix.directory }}/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 14
