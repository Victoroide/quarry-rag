name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration per fuzz target
        required: false
        default: 2m
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/extractor
            target: FuzzResolveContext
          - package: ./internal/extractor
            target: FuzzExtractors
          - package: ./internal/chunker
            target: FuzzChunk
          - package: ./internal/textutil
            target: FuzzSanitizeForPrompt
          - package: ./internal/textutil
            target: FuzzNormalizeForIngest
          - package: ./internal/pipeline
            target: FuzzBuildSynthesisPrompt
          - package: ./internal/api/handler
            target: FuzzDecodeJSONObject
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '2m' }}
          PKG: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" "$PKG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 14
